<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Learning Bank</title>
  </head>
  <body>
    <main>
      <h1>Learning Bank</h1>
      <nav aria-label="Bank navigation">
        <a href="#accounts">Accounts</a>
        <a href="#transactions">Transactions</a>
      </nav>

      <section id="accounts">
        <h2>Account overview</h2>
        <div class="d-flex justify-between items-center">
          <span>Checking balance</span>
          <small class="text-gray-400" data-testid="account-balance">$125.00</small>
        </div>
      </section>

      <section id="transactions">
        <h2>Recent transactions</h2>
        <ul>
          <li>Opening deposit $125.00</li>
        </ul>
      </section>
    </main>
  </body>
</html>
