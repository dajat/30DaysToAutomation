name: Mini-Shop Playwright Tests

on:
  push:
    branches: [main, master, "fix/**"]
    paths:
      - "Mini-Shop-Project/**"
      - ".github/workflows/mini-shop-playwright.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "Mini-Shop-Project/**"
      - ".github/workflows/mini-shop-playwright.yml"

concurrency:
  group: mini-shop-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    defaults:
      run:
        working-directory: Mini-Shop-Project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run Mini-Shop Playwright tests
        run: |
          chown "$(id -u):$(id -g)" "$HOME"
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-shop-playwright-report
          path: Mini-Shop-Project/playwright-report/
          retention-days: 30
